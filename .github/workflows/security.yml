name: Security Scan

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Bandit (Python Security)
      working-directory: ./backend
      run: |
        pip install bandit
        bandit -r app/

    - name: Run npm audit (Frontend Security)
      working-directory: ./frontend
      run: npm audit --audit-level=high || true
