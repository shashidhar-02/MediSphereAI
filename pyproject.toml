[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medisphere-ai"
version = "1.0.0"
description = "Enterprise Hospital Operations Intelligence & Multi-Agent Platform"
readme = "README.md"
requires-python = ">=3.14"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "backend/tests",
    "tests/unit",
    "tests/integration"
]

[tool.ruff]
line-length = 100
target-version = "py314"
